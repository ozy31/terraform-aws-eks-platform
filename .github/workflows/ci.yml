name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: "1.15.5"
  TERRAGRUNT_VERSION: "1.0.7"
  TFLINT_VERSION: "v0.65.0"

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: Install terragrunt
        run: |
          curl -sSfL -o /usr/local/bin/terragrunt \
            "https://github.com/gruntwork-io/terragrunt/releases/download/v${TERRAGRUNT_VERSION}/terragrunt_linux_amd64"
          chmod +x /usr/local/bin/terragrunt
          terragrunt --version

      - name: terragrunt hcl fmt
        run: terragrunt hcl fmt --check --working-dir live

      - name: terragrunt hcl validate
        working-directory: live
        env:
          TG_TF_PATH: terraform
        run: terragrunt hcl validate --inputs

  validate:
    name: validate (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - modules/vpc
          - modules/eks
          - modules/karpenter
          - modules/platform-addons
          - examples/complete
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: terraform init
        working-directory: ${{ matrix.dir }}
        run: terraform init -backend=false -input=false

      - name: terraform validate
        working-directory: ${{ matrix.dir }}
        run: terraform validate

  tflint:
    name: tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: ~/.tflint.d/plugins
          key: tflint-${{ hashFiles('.tflint.hcl') }}

      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: tflint --init --config="$GITHUB_WORKSPACE/.tflint.hcl"

      - name: tflint
        run: |
          set -euo pipefail
          for d in modules/* examples/complete; do
            echo "::group::$d"
            tflint --chdir="$d" --config="$GITHUB_WORKSPACE/.tflint.hcl" --format=compact
            echo "::endgroup::"
          done

  helm-lint:
    name: helm lint (karpenter-resources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v4

      - name: helm lint
        run: |
          helm lint modules/karpenter/charts/karpenter-resources \
            --set clusterName=ci --set nodeRole=ci-node-role
          helm template ci modules/karpenter/charts/karpenter-resources \
            --set clusterName=ci --set nodeRole=ci-node-role --set nodeClass.os=bottlerocket >/dev/null

  security:
    name: trivy config scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: trivy config
        # v0.36.0, pinned by commit SHA
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore
          skip-dirs: "**/.terraform"
